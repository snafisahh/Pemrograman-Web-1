<html>
    <head>
        <title>Pendaftaran Kursus</title>
        <style>
            body {
                background-color: white;
                font-family: Arial, Helvetica, sans-serif;
            }

            .kotak-form {
                width: 500px;
                margin: 30px auto;
                border: 4px solid;
                border-color: gray black black gray;
                background-color: white; 
                padding: 1.5px;
            }

            .kotak {
                border: 0.5px solid black; 
                margin-bottom: 3px;
            }

            .judul-form {
                background-color: skyblue;
                text-align: center;
                padding: 18px;
                font-size: 24px;
                font-weight: bold;
                color: red;
            }

            .judul {
                font-family: Arial, Helvetica, sans-serif;
                font-weight: bold;
                font-size: 17px;
                margin-bottom: 10px;
            }

            .data {
                background-color: gray;
                padding: 4px 10px 10px 3px;
                font-family: 'Times New Roman', Times, serif;
            }

            .komentar {
                background-color: salmon;
                padding: 4px 10px 10px 3px;
                font-family: 'Times New Roman', Times, serif;
            }

            .judul-komentar {
                font-family: 'Times New Roman', Times, serif;
                margin-bottom: 3px;
            }

            table {
                width: 100%;
                margin-bottom: 10px;
            }

            td {
                padding: 2px 4px 2px 0;
                vertical-align: top;
                font-size: 14px;
            }

            input[type="text"] {
                width: 200px;
                font-family: 'Times New Roman', Times, serif;
            }

            select {
                width: 230px;
                font-family: 'Times New Roman', Times, serif;
            }

            textarea {
                width: 100%;
                height: 80px;
                font-family: 'Times New Roman', Times, serif;
            }

            .button {
                margin-top: 8px;
                margin-bottom: 8px;
            }
        </style>
    </head>

    <body>
    <form action="#" method="post">
        <div class="kotak-form">
            <div class="kotak judul-form">Pendaftaran Kursus</div>

            <div class="kotak data">
            <div class="judul">Data Diri</div>

            <table>
                <tr>
                    <td width="150">Nama</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>NIM</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>E-mail</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>Tanggal Lahir</td>
                    <td><input type="date" name="tgl" id="tgl"></td>
                </tr>
                <tr>
                    <td>Jenis Kelamin</td>
                    <td>
                        <input type="radio" name="jk"> Laki-laki <br>
                        <input type="radio" name="jk"> Perempuan
                    </td>
                </tr>
                <tr>
                    <td>Pilih Program Kursus</td>
                    <td>
                        <input type="checkbox"> C# <br>
                        <input type="checkbox"> Java <br>
                        <input type="checkbox"> SQL <br>
                        <input type="checkbox"> HTML dan PHP
                    </td>
                </tr>
                <tr>
                    <td>Pilihan Hari/Jam Kursus</td>
                    <td>
                        <select>
                            <option>Senin - Rabu / 09.00 - 11.00</option>
                            <option>Senin - Rabu / 13.00 - 15.00</option>
                            <option>Selasa - Kamis / 09.00 - 11.00</option>
                            <option>Selasa - Kamis / 13.00 - 15.00</option>
                        </select>
                    </td>
                </tr>
            </table>
            </div>

            <div class="kotak komentar">
            <div class="judul-komentar">Komentar Anda</div>
            <textarea></textarea>

            <div class="button">
                <input type="reset" value="Reset">
                <input type="submit" value="Submit">
                <input type="button" value="Cancel">
            </div>
            </div>
        </div>
    </form>
    </body>
</html>
